name: Tests
on:
  push:
    paths-ignore:
      - "docs/**"
    branches:
      - master

  pull_request:
    paths-ignore:
      - "docs/**"
    branches:
      - "**"

jobs:
  backend-tests:
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:12-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: disfactory_data
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 30s
          --health-retries 5

    runs-on: ubuntu-latest
    # Docker Hub image that job executes in
    container: python:3.7

    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Setup .env
        run: |
          cp .env.sample .env
          sed -i -e s/DISFACTORY_BACKEND_DEFAULT_DB_HOST=db/DISFACTORY_BACKEND_DEFAULT_DB_HOST=postgres/g .env

      - name: Run pytest tests
        run: |
          uv run pytest -vv -k "not test_easymap"

      - name: Run Django tests
        run: |
          uv run python manage.py test -v 2

      - name: Test startup scripts
        run: |
          ./scripts/test-startup-scripts.sh
