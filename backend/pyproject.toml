[tool.black]
line-length = 99
target-version = ['py39']
include = '\.pyi?$'
exclude = '''
(
  /(
    | \.mypy_cache
    | \.venv
  )/
  | migrations
)
'''

[project]
name = "disfactory"
version = "0.0.0"
description = ""
authors = []
requires-python = ">=3.9"
dependencies = [
    "django==2.2.27",
    "psycopg2-binary==2.8.6",
    "djangorestframework==3.11.2",
    "python-dotenv==0.14.0",
    "requests==2.25.1",
    "pillow==9.0.1",
    "django-cors-headers==3.7.0",
    "gunicorn==20.1.0",
    "django-admin-rangefilter==0.6.4",
    "drf-yasg==1.17.1",
    "python-docx==0.8.11",
    "docxcompose==1.3.2",
    "django-q==1.0.2",
    "django-import-export==2.5.0",
    "pytest-dotenv==0.5.2",
    # Runtime requirement via gunicorn 20.1.0 (imports pkg_resources,
    # removed from setuptools >= 81). Revisit on the gunicorn upgrade
    # (newer releases dropped it).
    "setuptools<81",
]

[dependency-groups]
dev = [
    "black==22.8.0",
    "freezegun==1.2.2",
    "pylint==2.15.2",
    "pylint-django==2.5.3",
    "flake8==5.0.4",
    "pytest-django==4.5.2",
    "pytest-cov",
]

[tool.uv]
package = false
